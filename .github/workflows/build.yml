name: Build Sonic Mania Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Set Up Symbolic Link for Game Logic
        run: |
          # This links Sonic Mania's code as a build component inside the RSDKv5 engine wrapper
          cd dependencies/RSDKv5/android/app/jni || cd android/app/jni
          ln -s ../../../../ GameLogic

      - name: Grant Execute Permission for Gradle
        run: |
          cd dependencies/RSDKv5/android || cd android
          chmod +x gradlew

      - name: Build Android Debug APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-android.outputs.sdk-path }}/ndk/25.2.9519653
        run: |
          cd dependencies/RSDKv5/android || cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Mania-Android-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
.GENERAL_FLAGS}} ${{env.V5U_FLAGS}}
          cmake --build build_v5U --parallel
      - name: Move artifacts
        run: |
          mkdir artifacts
          mkdir artifacts/v5
          mkdir artifacts/v5U
          mv ./build_v5/lib*.so ./artifacts/v5/
          mv ./build_v5U/lib*.so ./artifacts/v5U/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mania-linux
          path: artifacts
